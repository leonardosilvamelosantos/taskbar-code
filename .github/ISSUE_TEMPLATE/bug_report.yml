name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug and what you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 23H2
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: output of `python --version`
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: output of `node --version`
    validations:
      required: true
  - type: dropdown
    id: terminal
    attributes:
      label: Terminal
      options:
        - Warp
        - Windows Terminal
        - Other
    validations:
      required: true
  - type: input
    id: dpi-scaling
    attributes:
      label: Display scaling (DPI)
      description: e.g. 100%, 125%, 150% — check Windows Display settings
      placeholder: "125%"
  - type: textarea
    id: log
    attributes:
      label: Contents of ticker.log
      description: >-
        Located at `~/.claude/taskbar-hero/ticker.log`. It's normally empty
        — if it has content, paste it here.
      render: text
